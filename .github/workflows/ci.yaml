# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: ''
  DOTNET_MULTILEVEL_LOOKUP: 0

jobs:
  # `build` and `test-guest` each run once per supported runtime: `PAWPRINT_TEST_RUNTIME` selects
  # the framework the suite runs its guests on (see `FrameworkUnderTest.fs`). The test host itself
  # runs on the oldest supported runtime on every leg.
  #
  # Both build and run the test projects in a checkout holding only the test footprint (see
  # scripts/footprint.py), so a test that reads a file the footprint does not name fails here
  # rather than passing on a tree that happens to have it. Both skip that on a pull request that
  # changes nothing in the footprint: the merge then has the same test inputs as main. The skip is
  # by step, because all-required-checks-complete counts a skipped job as a failure. Neither
  # builds the whole solution; nuget-pack does.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [ Net10, Net11 ]
    env:
      PAWPRINT_TEST_RUNTIME: ${{ matrix.runtime }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0 # for NerdBank.GitVersioning's history, and to compare the merge with main
    - name: Install Nix
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    # The one definition of this step; the other jobs that skip on it refer to it by alias.
    - &decide-whether-tests-are-affected
      name: Decide whether this change can affect the tests
      id: affected
      env:
        # The commit a merge-queue group is built on, and empty for any other event.
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: |
        # A pull request or a merge-queue group runs the tests only if it changes a path they
        # read, compared with what it is built on. For a pull request that is the first parent of
        # GitHub's merge. For a group it is the group's base, not its commit's parent: the two
        # are one commit when the queue squashes a single pull request, but a rebased or batched
        # group stacks several commits on the base. A push to main runs everything: that run is
        # what says main passes, which both skips take on trust.
        case "${{ github.event_name }}" in
          pull_request) tests="$(python3 scripts/footprint.py affected --merge HEAD)" ;;
          merge_group) tests="$(python3 scripts/footprint.py affected "$MERGE_GROUP_BASE" HEAD)" ;;
          *) tests=true ;;
        esac
        echo "tests=$tests" >> "$GITHUB_OUTPUT"
    - name: Check out the test footprint alone
      if: ${{ steps.affected.outputs.tests == 'true' }}
      run: python3 scripts/footprint.py clone tests "$RUNNER_TEMP/footprint"
    - name: Build
      if: ${{ steps.affected.outputs.tests == 'true' }}
      working-directory: ${{ runner.temp }}/footprint
      run: |
        projects="$(python3 scripts/footprint.py test-projects)"
        for project in $projects; do
          nix develop "$GITHUB_WORKSPACE" --command dotnet build "$project" --configuration Release
        done
    # Tests the Release binaries the step above produced, rather than rebuilding and
    # testing Debug: a bare `dotnet test` did the latter, so this job threw away its own
    # build and then ran the more expensive configuration. Debug costs ~20% more time and
    # ~20% more allocation than Release across the suite, and this was the only job that
    # tested Debug and the only one whose runner ever died of resource starvation.
    # The guest-running fixtures are `[<Explicit>]`, which keeps them out of a bare
    # `dotnet test` so that local iteration costs seconds rather than minutes. CI wants all
    # of them, so `test-guest` below selects them by category, on runners of their own so
    # that they run beside this step rather than after it. Two invocations rather than one
    # filter that matches everything is deliberate: "run the default set, then run the set
    # we excluded from it" cannot silently stop covering something the way a clever filter
    # expression could.
    # The TRX files carry each test's duration. They're uploaded so that the tests can be
    # divided between runners by measured cost on CI's 4-vCPU hardware, which isn't
    # proportional to what a developer machine measures.
    - name: Test
      if: ${{ steps.affected.outputs.tests == 'true' }}
      working-directory: ${{ runner.temp }}/footprint
      run: |
        projects="$(python3 scripts/footprint.py test-projects)"
        for project in $projects; do
          nix develop "$GITHUB_WORKSPACE" --command dotnet test "$project" --no-build --configuration Release --logger "trx;LogFilePrefix=default" --results-directory TestResults
        done
    - name: Upload test results
      if: ${{ always() && steps.affected.outputs.tests == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.runtime }}
        path: ${{ runner.temp }}/footprint/TestResults/*.trx

  # The guest-running fixtures, which take longer than the rest of the suite put
  # together. They build for themselves rather than downloading `build`'s binaries: the
  # build is under two minutes, and this way neither job waits for the other.
  # They are split between two runners by category. `GuestSolo` holds fixtures whose
  # single tests each run for about as long as all of `Guest` does on one runner, so
  # together they would set the job's length. Each runner selects its own category
  # rather than one excluding the other's: a negated clause such as
  # `TestCategory!=GuestSolo` is never an explicit match in NUnit's sense, so every
  # case of an `[<Explicit>]` fixture is skipped under it and the run still passes.
  # `TestCiSelectsEveryExplicitFixture` reads `category` below and fails unless every
  # `[<Explicit>]` fixture carries exactly one of its values.
  test-guest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [ Net10, Net11 ]
        category: [ Guest, GuestSolo ]
    env:
      PAWPRINT_TEST_RUNTIME: ${{ matrix.runtime }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0 # for NerdBank.GitVersioning's history, and to compare the merge with main
    - name: Install Nix
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - *decide-whether-tests-are-affected
    - name: Check out the test footprint alone
      if: ${{ steps.affected.outputs.tests == 'true' }}
      run: python3 scripts/footprint.py clone tests "$RUNNER_TEMP/footprint"
    - name: Build
      if: ${{ steps.affected.outputs.tests == 'true' }}
      working-directory: ${{ runner.temp }}/footprint
      run: |
        projects="$(python3 scripts/footprint.py test-projects)"
        for project in $projects; do
          nix develop "$GITHUB_WORKSPACE" --command dotnet build "$project" --configuration Release
        done
    - name: Test (guest-running fixtures)
      if: ${{ steps.affected.outputs.tests == 'true' }}
      working-directory: ${{ runner.temp }}/footprint
      run: |
        projects="$(python3 scripts/footprint.py test-projects)"
        for project in $projects; do
          nix develop "$GITHUB_WORKSPACE" --command dotnet test "$project" --no-build --configuration Release --filter "TestCategory=${{ matrix.category }}" --logger "trx;LogFilePrefix=guest" --results-directory TestResults
        done
    - name: Upload test results
      if: ${{ always() && steps.affected.outputs.tests == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.category }}-${{ matrix.runtime }}
        path: ${{ runner.temp }}/footprint/TestResults/*.trx

  build-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: nix build --print-build-logs
      # This is really slow and also... flaky.
      # - name: Reproducibility check
      #   run: nix build --print-build-logs --rebuild

  check-dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Run Fantomas
        run: nix run .#fantomas -- --check .

  check-nix-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Run Alejandra
        run: nix develop --command alejandra --check .

  # Pull requests only. The script needs GitHub's merge of the branch into main,
  # whose second parent is the branch's head; a merge-queue run or a push to main
  # checks out a squash, which has one parent. That squash is of a pull request
  # whose own run already passed this check, so skipping it here misses only a
  # change to main, made after that run, which alters what the change detaches.
  # The steps are skipped rather than the job, because
  # all-required-checks-complete counts a skipped job as a failure.
  check-docstring-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the check compares against the commit this change starts from
      - name: Check every docstring still documents what it did
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          # A pull_request checkout is GitHub's merge of the branch into main:
          # its first parent is that main, and its second the branch's head.
          git rev-parse --verify --quiet HEAD^2 > /dev/null || { echo "expected a merge commit at HEAD for a pull_request event" >&2; exit 2; }
          base="$(git rev-parse HEAD^1)"
          range="HEAD^1..HEAD^2"
          set +e
          scripts/check-docstring-attachment-branch.sh "$base"
          status=$?
          set -e
          # The check reports every change of subject it cannot explain, and a
          # change that repairs a detachment, or renames onto a name used
          # elsewhere, is one of those. A commit in the change that carries this
          # trailer says a person read the report and found nothing detached.
          if [ "$status" -eq 1 ] && git log --format=%B "$range" | grep -qx 'Docstring-attachment: reviewed'; then
            echo "::warning::docstring-attachment reported changes of subject, and a commit in this change says they were reviewed"
            exit 0
          fi
          exit "$status"

  # Each package's pathFilters and the test footprint are generated from what the projects say
  # they read (scripts/footprint.py). `check` fails unless the committed ones are what the projects
  # say now. `verify packages` packs each package from a checkout of its footprint alone and
  # requires the result to be byte-identical to the whole tree's, which is what catches a read
  # the projects do not declare. It is skipped whenever the tests are, which is sound because the
  # script refuses to generate a package footprint that the test footprint does not cover.
  check-footprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # for NerdBank.GitVersioning's history, and to compare the merge with main
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check the footprints are the ones the projects describe
        run: nix develop --command python3 scripts/footprint.py check
      - *decide-whether-tests-are-affected
      - name: Pack each package from its footprint alone
        if: ${{ steps.affected.outputs.tests == 'true' }}
        run: nix develop --command python3 scripts/footprint.py verify packages

  flake-check:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Flake check
        run: nix flake check

  nuget-pack:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0 # so that NerdBank.GitVersioning has access to history
    - name: Install Nix
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Restore dependencies
      run: nix develop --command dotnet restore
    - name: Build
      run: nix develop --command dotnet build --no-restore --configuration Release
    - name: Pack
      run: nix develop --command dotnet pack --configuration Release
    - name: Upload NuGet artifact (PawPrint)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-package-pawprint
        path: WoofWare.PawPrint/bin/Release/WoofWare.PawPrint.*.nupkg
    - name: Upload NuGet artifact (Domain)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-package-domain
        path: WoofWare.PawPrint.Domain/bin/Release/WoofWare.PawPrint.Domain.*.nupkg
    - name: Upload NuGet artifact (Semantics)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-package-semantics
        path: WoofWare.PawPrint.Semantics/bin/Release/WoofWare.PawPrint.Semantics.*.nupkg
    - name: Upload NuGet artifact (Loader)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-package-loader
        path: WoofWare.PawPrint.Loader/bin/Release/WoofWare.PawPrint.Loader.*.nupkg
    - name: Upload NuGet artifact (TypeSystem)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-package-typesystem
        path: WoofWare.PawPrint.TypeSystem/bin/Release/WoofWare.PawPrint.TypeSystem.*.nupkg
    - name: Upload NuGet artifact (Analysis)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-package-analysis
        path: WoofWare.PawPrint.Analysis/bin/Release/WoofWare.PawPrint.Analysis.*.nupkg

  expected-pack:
    needs: [nuget-pack]
    runs-on: ubuntu-latest
    steps:
      - name: Download NuGet artifact (PawPrint)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-pawprint
          path: packed-pawprint
      - name: Check NuGet contents
        # Verify that there is exactly one nupkg in the artifact that would be NuGet published
        run: if [[ $(find packed-pawprint -maxdepth 1 -name 'WoofWare.PawPrint.*.nupkg' -printf c | wc -c) -ne "1" ]]; then exit 1; fi
      - name: Download NuGet artifact (Domain)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-domain
          path: packed-domain
      - name: Check NuGet contents
        # Verify that there is exactly one nupkg in the artifact that would be NuGet published
        run: if [[ $(find packed-domain -maxdepth 1 -name 'WoofWare.PawPrint.Domain.*.nupkg' -printf c | wc -c) -ne "1" ]]; then exit 1; fi
      - name: Download NuGet artifact (Semantics)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-semantics
          path: packed-semantics
      # WoofWare.PawPrint's nuspec depends on this package because a ProjectReference always
      # becomes one. If it ever stopped being produced, that dependency would point at nothing
      # and the PawPrint package would be uninstallable -- with every other check here still
      # green, since the assembly would simply be missing from lib/ rather than the build failing.
      - name: Check NuGet contents
        # Verify that there is exactly one nupkg in the artifact that would be NuGet published
        run: if [[ $(find packed-semantics -maxdepth 1 -name 'WoofWare.PawPrint.Semantics.*.nupkg' -printf c | wc -c) -ne "1" ]]; then exit 1; fi
      - name: Download NuGet artifact (Loader)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-loader
          path: packed-loader
      # WoofWare.PawPrint's nuspec depends on this package because a ProjectReference always
      # becomes one. If it ever stopped being produced, that dependency would point at nothing
      # and the PawPrint package would be uninstallable -- with every other check here still
      # green, since the assembly would simply be missing from lib/ rather than the build failing.
      - name: Check NuGet contents
        # Verify that there is exactly one nupkg in the artifact that would be NuGet published
        run: if [[ $(find packed-loader -maxdepth 1 -name 'WoofWare.PawPrint.Loader.*.nupkg' -printf c | wc -c) -ne "1" ]]; then exit 1; fi
      - name: Download NuGet artifact (TypeSystem)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-typesystem
          path: packed-typesystem
      # WoofWare.PawPrint's nuspec depends on this package because a ProjectReference always
      # becomes one. If it ever stopped being produced, that dependency would point at nothing
      # and the PawPrint package would be uninstallable -- with every other check here still
      # green, since the assembly would simply be missing from lib/ rather than the build failing.
      - name: Check NuGet contents
        # Verify that there is exactly one nupkg in the artifact that would be NuGet published
        run: if [[ $(find packed-typesystem -maxdepth 1 -name 'WoofWare.PawPrint.TypeSystem.*.nupkg' -printf c | wc -c) -ne "1" ]]; then exit 1; fi
      - name: Download NuGet artifact (Analysis)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-analysis
          path: packed-analysis
      # Nothing else here depends on this package; the check is that it is produced at all.
      - name: Check NuGet contents
        # Verify that there is exactly one nupkg in the artifact that would be NuGet published
        run: if [[ $(find packed-analysis -maxdepth 1 -name 'WoofWare.PawPrint.Analysis.*.nupkg' -printf c | wc -c) -ne "1" ]]; then exit 1; fi

  github-release-dry-run:
    strategy:
      matrix:
        artifact:
        - nuget-package-pawprint
        - nuget-package-domain
        - nuget-package-semantics
        - nuget-package-loader
        - nuget-package-typesystem
        - nuget-package-analysis
    runs-on: ubuntu-latest
    needs: [nuget-pack]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
      - name: Compute package path
        id: compute-path
        run: |
          find . -maxdepth 1 -type f -name 'WoofWare.PawPrint.*.nupkg' -exec sh -c 'echo "output=$(basename "$1")" >> $GITHUB_OUTPUT' shell {} \;
      - name: Compute tag name
        id: compute-tag
        env:
          NUPKG_PATH: ${{ steps.compute-path.outputs.output }}
        run: echo "output=$(basename "$NUPKG_PATH" .nupkg)" >> $GITHUB_OUTPUT
      - name: Tag and release
        uses: G-Research/common-actions/github-release@19d7281a0f9f83e13c78f99a610dbc80fc59ba3b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-commitish: ${{ github.sha }}
          tag: ${{ steps.compute-tag.outputs.output }}
          binary-contents: ${{ steps.compute-path.outputs.output }}
          dry-run: true

  all-required-checks-complete:
    if: ${{ always() }}
    needs: [check-dotnet-format, check-nix-format, check-docstring-attachment, check-footprints, build, test-guest, build-nix, flake-check, nuget-pack, expected-pack, github-release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - uses: G-Research/common-actions/check-required-lite@2b7dc49cb14f3344fbe6019c14a31165e258c059
        with:
          needs-context: ${{ toJSON(needs) }}

  attestation-domain:
    runs-on: ubuntu-latest
    needs: [all-required-checks-complete]
    # if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    if: false
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-domain
          path: packed
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "packed/*.nupkg"

  attestation-pawprint:
    runs-on: ubuntu-latest
    needs: [all-required-checks-complete]
    # if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    if: false
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-pawprint
          path: packed
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "packed/*.nupkg"

  nuget-publish-domain:
    runs-on: ubuntu-latest
    # if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    if: false
    needs: [all-required-checks-complete]
    environment: main-deploy
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-domain
          path: packed
      - name: Identify `dotnet`
        id: dotnet-identify
        run: nix develop --command bash -c 'echo "dotnet=$(which dotnet)" >> $GITHUB_OUTPUT'
      - name: Obtain NuGet key
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544
        id: login
        with:
            user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        id: publish-success
        uses: G-Research/common-actions/publish-nuget@2b7dc49cb14f3344fbe6019c14a31165e258c059
        with:
          package-name: WoofWare.PawPrint.Domain
          nuget-key: ${{ steps.login.outputs.NUGET_API_KEY }}
          nupkg-dir: packed/
          dotnet: ${{ steps.dotnet-identify.outputs.dotnet }}

  nuget-publish-pawprint:
    runs-on: ubuntu-latest
    # if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    if: false
    needs: [all-required-checks-complete]
    environment: main-deploy
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package-pawprint
          path: packed
      - name: Identify `dotnet`
        id: dotnet-identify
        run: nix develop --command bash -c 'echo "dotnet=$(which dotnet)" >> $GITHUB_OUTPUT'
      - name: Obtain NuGet key
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544
        id: login
        with:
            user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        id: publish-success
        uses: G-Research/common-actions/publish-nuget@2b7dc49cb14f3344fbe6019c14a31165e258c059
        with:
          package-name: WoofWare.PawPrint
          nuget-key: ${{ steps.login.outputs.NUGET_API_KEY }}
          nupkg-dir: packed/
          dotnet: ${{ steps.dotnet-identify.outputs.dotnet }}

  github-release:
    strategy:
      matrix:
        artifact:
        - nuget-package-domain
        - nuget-package-pawprint
    runs-on: ubuntu-latest
    # if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    if: false
    needs: [all-required-checks-complete]
    environment: main-deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
      - name: Compute package path
        id: compute-path
        run: |
          find . -maxdepth 1 -type f -name 'WoofWare.PawPrint.*.nupkg' -exec sh -c 'echo "output=$(basename "$1")" >> $GITHUB_OUTPUT' shell {} \;
      - name: Compute tag name
        id: compute-tag
        env:
          NUPKG_PATH: ${{ steps.compute-path.outputs.output }}
        run: echo "output=$(basename "$NUPKG_PATH" .nupkg)" >> $GITHUB_OUTPUT
      - name: Tag and release
        uses: G-Research/common-actions/github-release@19d7281a0f9f83e13c78f99a610dbc80fc59ba3b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-commitish: ${{ github.sha }}
          tag: ${{ steps.compute-tag.outputs.output }}
          binary-contents: ${{ steps.compute-path.outputs.output }}
